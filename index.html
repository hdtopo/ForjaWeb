  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #ffffff; color: #14140f; font-family: Inter, system-ui, sans-serif; }
    .nf-page { max-width: 1080px; margin: 0 auto; }

    h3 { font-size: 25px; }

    p:last-child { margin-bottom: 0; }
    a { color: inherit; }
    .nf-btn { display: inline-block; background: #14140f; color: #ffffff; padding: 13px 22px; border-radius: 999px; text-decoration: none; font-weight: 500; font-size: 15px; }
    img { max-width: 100%; display: block; }
    table { width: 100%; border-collapse: collapse; font-size: 16px; }
    th, td { border-bottom: 1px solid #e6e3db; padding: 12px 14px; text-align: left; }
    th { font-weight: 600; }
    ul, ol { margin: 0 0 14px; padding-left: 22px; line-height: 1.7; }
    hr { border: 0; border-top: 1px solid #e6e3db; }
    .nf-spacer { width: 100%; }
    
    body { background: #ffffff; color: #14140f; font-family: Inter, system-ui, sans-serif; }
